<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exportar progresso APH</title><style>body{font:16px system-ui;background:#0a1724;color:#f0f8ff;max-width:600px;padding:32px;margin:auto}button{padding:13px;border:0;border-radius:12px;background:#7ad7f3;color:#082034;font-weight:bold}p{line-height:1.6}</style><h1>Exportar progresso APH</h1><p>Esta página deve ser aberta no endereço do GitHub Pages, onde seu progresso antigo está salvo.</p><p>Ela somente lê o progresso deste navegador e cria um arquivo JSON local.</p><button id="download">Baixar meu progresso</button><p id="status"></p><script>document.getElementById('download').onclick=()=>{try{const raw=JSON.parse(localStorage.getItem('aph_portal_progresso_v1')||'[]');if(!Array.isArray(raw))throw Error('Dados inválidos');const blob=new Blob([JSON.stringify({format:'aph-progresso-v1',items:raw,exportadoEm:new Date().toISOString()},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='progresso_aph.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);document.getElementById('status').textContent=raw.length+' aulas no backup. Depois importe o JSON em Meu progresso no site Cloudflare.'}catch(e){document.getElementById('status').textContent=e.message}}</script></html>
